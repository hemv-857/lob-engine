[package]
name = "lob-engine"
version = "0.1.0"
edition = "2021"
description = "Price-time priority limit order book with execution algorithm study"
license = "MIT"

[dependencies]
# ponytail: std-only by design -- zero-dep keeps builds fast and audit trivial

[dev-dependencies]

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "study"
path = "src/bin/study.rs"

[profile.release]
lto = true
codegen-units = 1
